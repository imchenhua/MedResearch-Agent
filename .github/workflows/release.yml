name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 20

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      ASYNC_BUILTIN_TEAM_SOURCE: ${{ github.workspace }}/agency-agents
      npm_config_msvs_version: "2022"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out builtin team repository
        uses: actions/checkout@v4
        with:
          repository: msitarzewski/agency-agents
          path: agency-agents
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Locate Visual Studio for node-gyp
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { Write-Error 'no Visual Studio with C++ tools found'; exit 1 }
          "GYP_MSVS_OVERRIDE_PATH=$vs" >> $env:GITHUB_ENV
          Write-Host "VS path: $vs"

      - name: Build Windows installers
        id: winbuild
        continue-on-error: true
        shell: pwsh
        run: npm run release:win 2>&1 | Tee-Object -FilePath build-win.log

      - name: Upload Windows build log
        if: steps.winbuild.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build-win.log
          if-no-files-found: warn

      - name: Fail if Windows build failed
        if: steps.winbuild.outcome == 'failure'
        run: exit 1

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            release/*.exe
            release/*.msi
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  macos-release:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ASYNC_BUILTIN_TEAM_SOURCE: ${{ github.workspace }}/agency-agents

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out builtin team repository
        uses: actions/checkout@v4
        with:
          repository: msitarzewski/agency-agents
          path: agency-agents
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build macOS packages (unsigned)
        run: npm run release:mac:unsigned

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - windows-release
      - macos-release
    if: always() && needs.macos-release.result == 'success'

    steps:
      - name: Download Windows assets
        if: needs.windows-release.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-assets/windows

      - name: Download macOS assets
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: release-assets/macos

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
